<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打工薪資試算器 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .hero {
      background: linear-gradient(135deg, #1f4f82, #2f6fed);
      color: white;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 22px;
      box-shadow: 0 12px 30px rgba(47,111,237,.18);
    }
    .hero h1 { margin: 0 0 8px; font-size: 32px; }
    .hero p { margin: 0; opacity: .9; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(30,42,60,.07);
      margin-bottom: 20px;
    }
    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
      color: #17324d;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 14px; font-weight: 700; color: #475569; }
    input {
      width: 100%;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47,111,237,.1); }
    .full { grid-column: 1 / -1; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .primary { background: #2f6fed; color: white; }
    .secondary { background: #e8eef8; color: #24415f; }
    .danger { background: #fee2e2; color: #b91c1c; }
    .result-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #d9e0e8;
    }
    .stat:last-child { border-bottom: none; }
    .stat strong { color: #0f172a; }
    .big-money { font-size: 26px; color: #1d4ed8; font-weight: 800; }
    .alert {
      margin-top: 14px;
      border-radius: 12px;
      padding: 12px 14px;
      display: none;
      line-height: 1.5;
    }
    .alert.warn {
      display: block;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }
    .alert.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .alert.ok {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    .summary-box {
      background: #eef4ff;
      border-radius: 14px;
      padding: 16px;
    }
    .summary-box small { color: #64748b; display: block; margin-bottom: 5px; }
    .summary-box strong { font-size: 22px; color: #17324d; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 840px;
    }
    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }
    th { background: #f8fafc; color: #475569; }
    .table-wrap { overflow-x: auto; }
    .muted { color: #64748b; font-size: 13px; }
    .empty {
      text-align: center;
      padding: 28px;
      color: #94a3b8;
    }
    @media (max-width: 800px) {
      .grid, .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .summary { grid-template-columns: 1fr; }
      .hero h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>打工薪資試算器</h1>
      <p>快速計算工時、休息與預估薪資，並保存近期班別紀錄。</p>
    </section>

    <div class="grid">
      <section class="card">
        <h2>① 班別資料輸入</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="workDate">工作日期</label>
            <input id="workDate" type="date" />
          </div>
          <div class="field">
            <label for="startTime">上班時間（24 小時制）</label>
            <input id="startTime" type="text" inputmode="numeric" maxlength="5" placeholder="09:00" pattern="(?:[01]\d|2[0-3]):[0-5]\d" />
          </div>
          <div class="field">
            <label for="endTime">下班時間（24 小時制）</label>
            <input id="endTime" type="text" inputmode="numeric" maxlength="5" placeholder="17:00" pattern="(?:[01]\d|2[0-3]):[0-5]\d" />
          </div>
          <div class="field">
            <label for="breakStart">休息開始（24 小時制）</label>
            <input id="breakStart" type="text" inputmode="numeric" maxlength="5" placeholder="12:00" pattern="(?:[01]\d|2[0-3]):[0-5]\d" />
          </div>
          <div class="field">
            <label for="breakEnd">休息結束（24 小時制）</label>
            <input id="breakEnd" type="text" inputmode="numeric" maxlength="5" placeholder="13:00" pattern="(?:[01]\d|2[0-3]):[0-5]\d" />
          </div>
          <div class="field">
            <label for="hourlyWage">基本時薪（元）</label>
            <input id="hourlyWage" type="number" min="0" step="1" placeholder="例如 200" />
          </div>
          <div class="field">
            <label for="extraPay">額外加給（元，可留空）</label>
            <input id="extraPay" type="number" min="0" step="1" placeholder="例如 100" />
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="calcBtn">計算</button>
          <button class="secondary" id="resetBtn">清除輸入</button>
        </div>

        <div id="message" class="alert"></div>
      </section>

      <section class="card">
        <h2>② 計算結果</h2>
        <div class="result-box">
          <div class="stat"><span>班別總時數</span><strong id="shiftHours">－</strong></div>
          <div class="stat"><span>休息時間</span><strong id="breakMinutes">－</strong></div>
          <div class="stat"><span>實際工作時數</span><strong id="actualHours">－</strong></div>
          <div class="stat"><span>預估薪資</span><span id="salary" class="big-money">－</span></div>
        </div>

        <div id="restWarning" class="alert"></div>

        <div class="actions">
          <button class="primary" id="saveBtn">加入紀錄</button>
        </div>
        <p class="muted">休息提醒僅供參考，不影響薪資試算與紀錄儲存。</p>
      </section>
    </div>

    <section class="card">
      <h2>③ 班別紀錄與統計</h2>
      <div class="summary">
        <div class="summary-box">
          <small>累積工作時數</small>
          <strong id="totalHours">0 小時</strong>
        </div>
        <div class="summary-box">
          <small>累積預估薪資</small>
          <strong id="totalSalary">0 元</strong>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>班別</th>
              <th>休息</th>
              <th>實際工時</th>
              <th>時薪</th>
              <th>加給</th>
              <th>預估薪資</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const workDate = $("workDate");
    const startTime = $("startTime");
    const endTime = $("endTime");
    const breakStart = $("breakStart");
    const breakEnd = $("breakEnd");
    const hourlyWage = $("hourlyWage");
    const extraPay = $("extraPay");

    const shiftHoursEl = $("shiftHours");
    const breakMinutesEl = $("breakMinutes");
    const actualHoursEl = $("actualHours");
    const salaryEl = $("salary");
    const messageEl = $("message");
    const restWarningEl = $("restWarning");
    const recordsBody = $("recordsBody");
    const totalHoursEl = $("totalHours");
    const totalSalaryEl = $("totalSalary");

    let latestResult = null;

    function timeToMinutes(t) {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function formatHours(minutes) {
      const h = minutes / 60;
      return Number.isInteger(h) ? `${h} 小時` : `${h.toFixed(2)} 小時`;
    }

    function normalizeWithinShift(t, shiftStart, shiftEnd, isCrossDay) {
      let x = timeToMinutes(t);
      if (isCrossDay && x < shiftStart) x += 1440;
      return x;
    }

    function showMessage(text, type="error") {
      messageEl.className = `alert ${type}`;
      messageEl.textContent = text;
    }

    function clearMessage() {
      messageEl.className = "alert";
      messageEl.textContent = "";
    }

    function resetResult() {
      latestResult = null;
      shiftHoursEl.textContent = "－";
      breakMinutesEl.textContent = "－";
      actualHoursEl.textContent = "－";
      salaryEl.textContent = "－";
      restWarningEl.className = "alert";
      restWarningEl.textContent = "";
    }

    function isValid24HourTime(value) {
      return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
    }

    function setupTimeInput(el) {
      el.addEventListener("input", () => {
        let digits = el.value.replace(/\D/g, "").slice(0, 4);
        if (digits.length >= 3) {
          el.value = digits.slice(0, 2) + ":" + digits.slice(2);
        } else {
          el.value = digits;
        }
      });
    }

    [startTime, endTime, breakStart, breakEnd].forEach(setupTimeInput);

    function calculate() {
      clearMessage();
      resetResult();

      if (!workDate.value || !startTime.value || !endTime.value) {
        showMessage("請完整輸入班別資料");
        return;
      }

      if (!isValid24HourTime(startTime.value) || !isValid24HourTime(endTime.value)) {
        showMessage("請使用 24 小時制 HH:MM，例如 09:00、21:30");
        return;
      }

      if (startTime.value === endTime.value) {
        showMessage("上下班時間不得相同");
        return;
      }

      const wage = Number(hourlyWage.value);
      const extra = extraPay.value === "" ? 0 : Number(extraPay.value);

      if (!Number.isFinite(wage) || wage <= 0) {
        showMessage("基本時薪必須大於 0");
        return;
      }
      if (!Number.isFinite(extra)) {
        showMessage("請輸入有效的金額");
        return;
      }
      if (extra < 0) {
        showMessage("額外加給不得為負數");
        return;
      }

      const start = timeToMinutes(startTime.value);
      let end = timeToMinutes(endTime.value);
      const isCrossDay = end < start;
      if (isCrossDay) end += 1440;

      const shiftMinutes = end - start;
      let restMinutes = 0;
      let restStartAbs = null;
      let restEndAbs = null;

      const hasBreakStart = breakStart.value !== "";
      const hasBreakEnd = breakEnd.value !== "";

      if (hasBreakStart !== hasBreakEnd) {
        showMessage("請完整輸入休息開始與休息結束時間");
        return;
      }

      if ((hasBreakStart && !isValid24HourTime(breakStart.value)) ||
          (hasBreakEnd && !isValid24HourTime(breakEnd.value))) {
        showMessage("休息時間請使用 24 小時制 HH:MM");
        return;
      }

      if (hasBreakStart && hasBreakEnd) {
        restStartAbs = normalizeWithinShift(breakStart.value, start, end, isCrossDay);
        restEndAbs = normalizeWithinShift(breakEnd.value, start, end, isCrossDay);

        if (restEndAbs <= restStartAbs) {
          if (isCrossDay && restEndAbs < start + 1440) {
            restEndAbs += 1440;
          } else {
            showMessage("請輸入有效的休息時段");
            return;
          }
        }

        if (restStartAbs < start || restEndAbs > end) {
          showMessage("休息時段必須位於班別時間內");
          return;
        }

        restMinutes = restEndAbs - restStartAbs;
      }

      if (restMinutes >= shiftMinutes) {
        showMessage("休息時間不得大於或等於班別總時間");
        return;
      }

      const actualMinutes = shiftMinutes - restMinutes;
      const salary = actualMinutes / 60 * wage + extra;

      shiftHoursEl.textContent = formatHours(shiftMinutes);
      breakMinutesEl.textContent = `${restMinutes} 分鐘`;
      actualHoursEl.textContent = formatHours(actualMinutes);
      salaryEl.textContent = `${Math.round(salary).toLocaleString()} 元`;

      let warning = "";
      if (hasBreakStart) {
        const beforeBreak = restStartAbs - start;
        const afterBreak = end - restEndAbs;
        if (beforeBreak >= 240 && restMinutes < 30) {
          warning = "休息提醒：前段已連續工作達 4 小時，但本次休息少於 30 分鐘。";
        } else if (beforeBreak > 240) {
          warning = `休息提醒：休息前已連續工作 ${(beforeBreak/60).toFixed(1)} 小時，建議留意休息安排。`;
        } else if (afterBreak > 240) {
          warning = `休息提醒：休息後仍連續工作 ${(afterBreak/60).toFixed(1)} 小時，建議留意休息安排。`;
        }
      } else if (shiftMinutes > 240) {
        warning = "休息提醒：本班別超過 4 小時但未輸入休息時段，建議確認實際休息安排。";
      }

      if (warning) {
        restWarningEl.className = "alert warn";
        restWarningEl.textContent = warning + " 此提示僅供參考，不作為法律違規判定。";
      } else {
        restWarningEl.className = "alert ok";
        restWarningEl.textContent = "目前輸入未觸發休息提醒。";
      }

      latestResult = {
        id: Date.now(),
        date: workDate.value,
        startTime: startTime.value,
        endTime: endTime.value,
        breakStart: breakStart.value,
        breakEnd: breakEnd.value,
        breakMinutes: restMinutes,
        actualMinutes,
        wage,
        extra,
        salary: Math.round(salary)
      };

      showMessage("計算完成", "ok");
    }

    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem("wageCalculatorRecords") || "[]");
      } catch {
        return [];
      }
    }

    function setRecords(records) {
      localStorage.setItem("wageCalculatorRecords", JSON.stringify(records));
    }

    function saveRecord() {
      if (!latestResult) {
        showMessage("請先完成正確的薪資計算");
        return;
      }
      const records = getRecords();
      records.unshift(latestResult);
      setRecords(records);
      renderRecords();
      showMessage("已加入班別紀錄", "ok");
    }

    function deleteRecord(id) {
      const records = getRecords().filter(r => r.id !== id);
      setRecords(records);
      renderRecords();
    }

    function renderRecords() {
      const records = getRecords();
      recordsBody.innerHTML = "";

      if (records.length === 0) {
        recordsBody.innerHTML = '<tr><td colspan="8" class="empty">目前沒有班別紀錄</td></tr>';
        totalHoursEl.textContent = "0 小時";
        totalSalaryEl.textContent = "0 元";
        return;
      }

      let totalMinutes = 0;
      let totalSalary = 0;

      for (const r of records) {
        totalMinutes += r.actualMinutes;
        totalSalary += r.salary;
        const restLabel = r.breakStart && r.breakEnd
          ? `${r.breakStart}～${r.breakEnd} (${r.breakMinutes} 分)`
          : "無";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.date}</td>
          <td>${r.startTime}～${r.endTime}</td>
          <td>${restLabel}</td>
          <td>${formatHours(r.actualMinutes)}</td>
          <td>${r.wage.toLocaleString()} 元</td>
          <td>${r.extra.toLocaleString()} 元</td>
          <td>${r.salary.toLocaleString()} 元</td>
          <td><button class="danger" data-id="${r.id}">刪除</button></td>
        `;
        recordsBody.appendChild(tr);
      }

      totalHoursEl.textContent = formatHours(totalMinutes);
      totalSalaryEl.textContent = `${totalSalary.toLocaleString()} 元`;

      document.querySelectorAll("button[data-id]").forEach(btn => {
        btn.addEventListener("click", () => deleteRecord(Number(btn.dataset.id)));
      });
    }

    $("calcBtn").addEventListener("click", calculate);
    $("saveBtn").addEventListener("click", saveRecord);
    $("resetBtn").addEventListener("click", () => {
      [workDate, startTime, endTime, breakStart, breakEnd, hourlyWage, extraPay].forEach(el => el.value = "");
      clearMessage();
      resetResult();
    });

    renderRecords();
  </script>
</body>
</html>
